name: POP Audit CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: ${{ matrix.service }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - zabbix-service
          - cisco-service
          - ericsson-service
          - radio-service
          - orchestrator
          - report-service
          - gateway
    env:
      REPORT_DIR: /tmp/pop-audit-ci-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        working-directory: ${{ matrix.service }}
        run: python -m compileall -q app
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No service-local tests in this package."
          fi

  frontend:
    name: Frontend syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: node --check gateway/frontend/static/app.js

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose interpolation and service graph
        run: docker compose --env-file config/.env.example config --quiet
