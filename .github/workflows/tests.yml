name: POP Audit tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests python-dotenv pydantic fastapi openpyxl netmiko paramiko

      - name: Compile all Python services
        run: |
          python -m compileall -q             gateway orchestrator zabbix-service cisco-service             ericsson-service radio-service report-service tests

      - name: Run regression tests
        run: pytest -q
